# Grafana 数据源自动装配（provisioning）
# 位置：deploy/observability/grafana/provisioning/datasources/loki.yaml
#
# 为什么用 provisioning 而不是手工在 UI 里加：
#   手工加的数据源只存在 Grafana 的 SQLite 里，换机器/重建容器就没了；
#   探针、看板、告警规则全都依赖它指向 Loki。装配成文件才可复现、可版本化。

apiVersion: 1

datasources:
  - name: Loki
    type: loki
    uid: loki-default          # 固定 uid：写看板/告警时可以直接引用，不靠名字
    access: proxy              # Grafana 服务端代理访问，浏览器不直连 Loki
    url: http://loki:3100      # 容器网络内的服务名，不是 localhost
    isDefault: true
    editable: false            # 声明式管理：UI 里禁止手改，避免和文件漂移
    jsonData:
      maxLines: 1000           # 单次查询返回行数上限（日志页默认 1000）
      # 结构化元数据筛选（| task_id="t-1"）由 Loki 3.x 原生支持，Grafana 无需额外开关
      timeout: 60
